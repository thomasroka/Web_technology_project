<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Explore Nature</h1>
        <p>Discover the beauty of nature.</p>
    </header>

    <main>

        <article class="card">
            <h2>Mountain Landscape</h2>

            <figure>
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800"
                     alt="Beautiful mountain with trees and a lake">
                <figcaption>
                    Image of Mountain
                </figcaption>
            </figure>

            <p>
                Nature provides peace, beauty, and inspiration. Exploring
                natural environments helps reduce stress and improve well-being.
            </p>
        </article>

        <article class="card">
            <h2>Registration Form</h2>

            <form>
                <label for="email">Email:</label>
                <input type="email" id="email" required>

                <label for="date">Date of Visit:</label>
                <input type="date" id="date" required>

                <label for="range">Satisfaction Level:</label>
                <input type="range" id="range" min="0" max="100">

                <label for="website">Website:</label>
                <input type="url" id="website" placeholder="https://example.com">

                <label for="phone">Number:</label>
                <input
                    type="text"
                    id="phone"
                    pattern="^[0-9]{9}$"
                    placeholder="Enter phonenumber"
                    required>

                <label for="age">Age:</label>
                <input type="number" id="age" min="1" max="120">

                <label for="color">Favorite Color:</label>
                <input type="color" id="color">

                <button type="submit">Submit</button>
            </form>
        </article>

    </main>

</body>
</html>
